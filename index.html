<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef1ef" />
  <title>工作台 · 今日任务</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 弥散背景层 -->
  <div class="bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="grain"></span>
  </div>

  <main class="app">
    <header class="panel hero">
      <div class="hero-top">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">工作台</span>
        </div>
        <div class="hero-actions">
          <button class="btn btn-pill btn-primary" id="addTopBtn" type="button">
            <span class="plus" aria-hidden="true"></span>新建任务
          </button>
        </div>
      </div>

      <div class="hero-main">
        <div class="metric">
          <span class="metric-label">今日完成度</span>
          <div class="metric-value" aria-live="polite">
            <span id="percentNum">0</span><span class="percent-sign">%</span>
          </div>
          <span class="metric-sub" id="metricSub">0 / 0 已完成</span>
        </div>
        <div class="chips" id="chips" aria-label="各状态任务数量">
          <!-- 由 JS 渲染 -->
        </div>
      </div>

      <div class="progress" id="progressWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="今日任务完成进度">
        <div class="segments" id="segments"></div>
        <span class="progress-track" aria-hidden="true"></span>
      </div>
    </header>

    <section class="board" id="board" aria-label="今日任务看板">
      <!-- 三列由 JS 渲染 -->
    </section>

    <footer class="foot">
      <span>数据保存在本地浏览器 · 刷新不丢失</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
